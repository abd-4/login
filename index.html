<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUTRICORE - تسجيل الدخول</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-glow"></div>

    <div class="login-card">
        <h1 class="brand-title">NUTRICORE</h1>
        <h2 class="welcome-text">Welcome :</h2>

        <form>
            <div class="input-group">
                <label for="email">Email address</label>
                <input type="email" id="email" placeholder="ضع البريد الإلكتروني" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="ضع كلمة المرور" required>
            </div>

            <div class="options-row">
                <a href="#" class="forget-pass">Forget Password ?</a>
                <label class="remember-me">
                    <input type="checkbox">
                    <span>تذكرني</span>
                </label>
            </div>

            <button type="submit" class="btn-submit">تسجيل دخول</button>
        </form>

        <div class="divider">or</div>

        <button class="btn-signup">إنشاء حساب جديد</button>
    </div>

</body>
</html>
